<!doctype html>
<html lang="zh" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>Ships</title>
    <link rel="stylesheet" href="./styles/constants.css" />
    <link rel="stylesheet" href="./styles/tailwind.build.css" />
  </head>
  <body class="bg-transparent">
    <div
      id="panel"
      class="flex h-full w-full flex-col overflow-hidden"
      style="
        border-radius: var(--radius-window);
        background: var(--color-bg);
      "
    >
      <header
        id="tabbar"
        class="flex shrink-0 items-center justify-between gap-2 px-3"
        style="height: var(--tabbar-height); border-bottom: 1px solid var(--color-border)"
      >
        <div id="brand" class="flex shrink-0 items-center gap-2 pl-1">
          <img
            id="brand-icon"
            src="../../assets/imgs/app.png"
            alt="Ships"
            class="h-5 w-5 shrink-0 rounded-control"
          />
          <span id="brand-name" class="whitespace-nowrap text-[13px] font-semibold text-fg">Ships</span>
        </div>
        <nav id="tablist" class="flex min-w-0 flex-1 items-center justify-end gap-1.5 overflow-x-auto"></nav>
      </header>

      <main id="content" class="flex-1 overflow-y-auto px-4 py-3"></main>

      <footer
        class="flex shrink-0 items-center justify-between px-3 text-fg-muted"
        style="height: var(--footer-height); border-top: 1px solid var(--color-border)"
      >
        <span id="footer-version" class="font-mono text-[11px]"></span>
        <div class="flex items-center gap-1">
          <button id="btn-pin" class="icon-btn h-6 w-6" type="button"></button>
          <button id="btn-settings" class="icon-btn h-6 w-6" type="button"></button>
        </div>
      </footer>
    </div>

    <script src="./scripts/theme.js"></script>
    <script src="./scripts/constants.js"></script>
    <script src="./scripts/i18n.js"></script>
    <script src="./scripts/ui.js"></script>
    <script src="./scripts/tool-registry.js"></script>
    <script src="./scripts/tool-order.js"></script>
    <script src="./scripts/tools/timestamp.js"></script>
    <script src="./scripts/tools/subnet.js"></script>
    <script src="./scripts/tools/radix.js"></script>
    <script src="./scripts/tools/json-format.js"></script>
    <script src="./scripts/tools/ssh.js"></script>
    <script src="./scripts/tools/clipboard.js"></script>
    <script src="./scripts/tools/encode.js"></script>
    <script src="./scripts/tools/hash.js"></script>
    <script src="./scripts/tools/nutrient.js"></script>
    <script src="./scripts/app.js"></script>
  </body>
</html>
