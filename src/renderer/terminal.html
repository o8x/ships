<!doctype html>
<html lang="zh" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>Ships Terminal</title>
    <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css" />
    <link rel="stylesheet" href="./styles/constants.css" />
    <link rel="stylesheet" href="./styles/tailwind.build.css" />
  </head>
  <body class="term-window bg-transparent">
    <div id="term-shell" class="flex h-full w-full flex-col overflow-hidden">
      <!-- 头栏高度 / 字号由 styles/tailwind.css 的 #term-header 规则控制（字号跟随终端字号） -->
      <header
        id="term-header"
        class="flex shrink-0 items-center justify-between gap-2 px-3"
        style="border-bottom: 1px solid var(--color-border); -webkit-app-region: drag"
      >
        <!-- 自绘小红绿灯（系统红绿灯由主进程隐藏）+「固定」按钮（开启后本窗口不缩成悬浮球） -->
        <div class="flex shrink-0 items-center gap-1.5">
          <div id="term-lights" class="flex shrink-0 items-center" style="-webkit-app-region: no-drag">
            <button id="light-close" class="traffic-light traffic-close" type="button"></button>
            <button id="light-minimize" class="traffic-light traffic-minimize" type="button"></button>
            <button id="light-zoom" class="traffic-light traffic-zoom" type="button"></button>
          </div>
          <button id="term-pin" class="icon-btn term-pin-btn" type="button" style="-webkit-app-region: no-drag"></button>
        </div>
        <div id="term-actions" class="flex shrink-0 items-center" style="-webkit-app-region: no-drag">
          <button id="btn-files" class="icon-btn" type="button"></button>
          <button id="btn-iterm" class="icon-btn" type="button"></button>
          <button id="btn-lines" class="icon-btn" type="button"></button>
          <button id="btn-split" class="icon-btn" type="button"></button>
        </div>
        <!-- 拖动 / 缩放期间在中间显示「列 × 行」（iTerm 式），停手后隐藏 -->
        <span id="term-size" class="hidden"></span>
      </header>
      <!-- 留白放在外层 #term-host 上；xterm 挂在无内边距的 #term-fit 里，见 scripts/terminal.js -->
      <main id="term-host" class="min-h-0 flex-1 overflow-hidden">
        <div id="term-gutter" class="hidden"></div>
        <div id="term-fit" class="h-full w-full"></div>
      </main>
      <!-- 终端 / 文件面板之间的可拖动分隔线（向上拖 = 终端变小），见 scripts/terminal-files.js -->
      <div id="term-divider" class="hidden"></div>
      <!-- 文件面板：点头部文件夹按钮显隐（不销毁连接），内容由 scripts/file-manager.js 构建 -->
      <section id="file-panel" class="hidden">
        <div id="file-panel-root" class="fm-root"></div>
      </section>
    </div>

    <!-- 悬浮球：终端窗口失去焦点时显示（由 CSS 呈圆形，图标由 terminal.js 注入） -->
    <div id="term-ball" class="hidden">
      <span id="term-ball-icon" class="term-ball-icon"></span>
    </div>

    <script src="./scripts/theme.js"></script>
    <script src="./scripts/constants.js"></script>
    <script src="./scripts/i18n.js"></script>
    <script src="./scripts/ui.js"></script>
    <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
    <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
    <script src="./scripts/file-manager.js"></script>
    <script src="./scripts/terminal-files.js"></script>
    <script src="./scripts/terminal.js"></script>
  </body>
</html>
