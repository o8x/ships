<!doctype html>
<html lang="zh" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>Ships</title>
    <link rel="stylesheet" href="./styles/constants.css" />
    <link rel="stylesheet" href="./styles/tailwind.build.css" />
  </head>
  <body style="background: var(--color-bg)">
    <div class="update-shell">
      <!-- 标题与系统红绿灯（hiddenInset）同一行；左侧留白避开红绿灯 -->
      <header class="update-titlebar">
        <h1 id="update-title" class="update-title"></h1>
      </header>
      <div class="update-progress"><div id="update-bar" class="update-progress-fill"></div></div>
      <div id="update-status" class="update-status"></div>
      <div class="update-actions">
        <button id="update-cancel" class="btn" type="button"></button>
        <button id="update-install" class="btn btn-accent" type="button" disabled></button>
      </div>
    </div>

    <script src="./scripts/theme.js"></script>
    <script src="./scripts/constants.js"></script>
    <script src="./scripts/i18n.js"></script>
    <script src="./scripts/update.js"></script>
  </body>
</html>
